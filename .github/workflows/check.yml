name: technical-checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.1.3 pandas==2.3.3 matplotlib==3.10.7
      - run: python -m unittest discover -s tests -v
      - run: python analysis/check_release.py
      - run: python analysis/plot_results.py --results-dir reference_results --output-dir outputs/figures
      - run: python analysis/plot_posthoc.py --results-dir reference_results/posthoc --output-dir outputs/posthoc_figures
